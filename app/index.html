<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141214" />
    <meta name="description" content="Rebecca Services - Netanya, toute Israël. Livraisons, courses et petits déménagements : devis en direct." />
    <title>Rebecca Services</title>
    <link rel="icon" type="image/png" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- 18 nov. 2026 : deux icones sur l'iPhone.
         rebeccaservices.com/admin → « Sur l'ecran d'accueil » installe « Rebecca admin » (s'ouvre sur l'espace prive).
         rebeccaservices.com → l'icone des clientes. Le bon « manifeste » est ecrit AVANT que Safari le lise. -->
    <script>
      (function () {
        var estAdmin = function () { return /^\/admin/.test(location.pathname) || /[?&]admin=1/.test(location.search) || location.hash.indexOf("#/admin") === 0; };
        var admin = estAdmin();
        if (admin && (!location.hash || location.hash === "#" || location.hash === "#/")) history.replaceState(null, "", location.pathname + location.search + "#/admin");
        document.write('<link rel="manifest" id="manifeste" href="' + (admin ? "/manifest-admin.webmanifest" : "/manifest.webmanifest") + '" />');
        document.write('<meta name="apple-mobile-web-app-title" content="' + (admin ? "Rebecca admin" : "Rebecca") + '" />');
        window.addEventListener("hashchange", function () {
          var l = document.getElementById("manifeste");
          if (l) l.setAttribute("href", estAdmin() ? "/manifest-admin.webmanifest" : "/manifest.webmanifest");
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- 17 nov. 2026 : si rien ne s'affiche au bout de 8 s (page gardee en memoire apres une publication), on propose de recharger -->
    <script>
      setTimeout(function () {
        var r = document.getElementById("root");
        if (r && !r.children.length) {
          r.innerHTML = '<div style="padding:24px;font-family:system-ui,sans-serif"><h2>Chargement trop long</h2><p>Appuie sur Recharger pour avoir la dernière version.</p><button onclick="location.reload()" style="padding:12px 20px;font-size:16px;border-radius:10px;border:0;background:#e7a9b4;font-weight:700">Recharger</button></div>';
        }
      }, 8000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
